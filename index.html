     <!DOCTYPE html>

        <style>
            body {

            header {

                color: white;
                padding: 10px 0;
                text-align: center;
            }
            header h1 {
                margin: 0;
                font-size: 24px;
            }
            nav {
                background-color: #444;
                padding: 10px 0;
                text-align: center;
            }
            nav a {
                color: white;
                margin: 0 15px;
                text-decoration: none;
                font-size: 18px;
            }
            nav a:hover {
                text-decoration: underline;
            }
            section {
                padding: 20px;
                text-align: center;
            }
            footer {
                background-color: #333;
                color: white;
                padding: 10px 0;
                text-align: center;
                position: fixed;
                width: 100%;
                bottom: 0;
            }
            /* Section Styles */
            #home, #product, #cases, #assets {
                background-color: white;
                margin: 20px 0;
                border: 1px solid #ddd;
                padding: 20px;
            }
    
            /* Chat button customization */
            .embeddedServiceHelpButton .helpButton .uiButton {
                background-color: #1947BA;
                font-family: "Arial", sans-serif;
            }
            .embeddedServiceHelpButton .helpButton .uiButton:focus {

            }
        </style>
